; ============================================================================
; PlatformIO 配置（推荐用 VS Code + PlatformIO 插件打开本项目）
; 如果你用 Arduino IDE，见 firmware/README.md 的迁移说明
; ============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; 串口监视器波特率，必须和 setup() 里 Serial.begin(115200) 一致
monitor_speed = 115200

; 上传波特率。CH340/CP210x 一般 921600 可用，失败就改成 115200
upload_speed = 921600

; 第三方库：PlatformIO 会自动下载
lib_deps =
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    claws/BH1750 @ ^1.3.0
    h2zero/NimBLE-Arduino @ ^1.4.3
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; 头文件搜索路径
build_flags =
    -I include
    -D CORE_DEBUG_LEVEL=0
    -Wall

; 分区表：默认即可（app0 1.25MB 足够）
board_build.partitions = default.csv
